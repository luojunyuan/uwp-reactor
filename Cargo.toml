[workspace]
members = ["crates/uwp-reactor", "examples/demo-gallery"]
exclude = ["reference/windows-rs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
windows-collections = { path = "reference/windows-rs/crates/libs/collections" }
windows-core = { path = "reference/windows-rs/crates/libs/core" }
windows-future = { path = "reference/windows-rs/crates/libs/future" }
windows-numerics = { path = "reference/windows-rs/crates/libs/numerics" }
windows-reference = { path = "reference/windows-rs/crates/libs/reference" }
windows-time = { path = "reference/windows-rs/crates/libs/time" }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
