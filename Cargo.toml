[workspace]
members = ["crates/uwp-reactor", "examples/demo-gallery"]
exclude = ["reference/windows-rs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
windows-core = { path = "reference/windows-rs/crates/libs/core" }
windows-reactor = { path = "reference/windows-rs/crates/libs/reactor" }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
